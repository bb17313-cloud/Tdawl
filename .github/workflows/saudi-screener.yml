name: Saudi Screener

on:
  workflow_dispatch:
  schedule:
    # من 6:45 إلى 12:30 UTC (يساوي 9:45 إلى 15:30 بتوقيت السعودية)
    - cron: "45,50,55 6 * * 0-4"          # 6:45, 6:50, 6:55
    - cron: "*/5 7-11 * * 0-4"            # كل 5 دقائق من 7:00 إلى 11:55
    - cron: "0,5,10,15,20,25,30 12 * * 0-4"  # من 12:00 إلى 12:30

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytz tradingview-screener

      - name: Run Screener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python screener.py
