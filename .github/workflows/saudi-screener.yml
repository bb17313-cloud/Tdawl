name: Saudi Screener

on:
  workflow_dispatch:
  # أبقِ جدولة التشغيل (schedule) الموجودة عندك هنا، مثال:
  # schedule:
  #   - cron: "*/15 7-12 * * 0-4"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytz tradingview-screener

      - name: Run Screener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python screener.py
