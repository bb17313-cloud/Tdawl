name: Saudi Market Movers Live Bot

on:
  schedule:
    - cron: '*/5 7-12 * * 0-4'
  workflow_dispatch:

jobs:
  run-saudi-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Market State
        uses: actions/cache@v4
        with:
          path: saudi_state.json
          key: saudi-state-${{ github.run_id }}
          restore-keys: |
            saudi-state-

      - name: Run Saudi Market Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python screener.py
